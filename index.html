<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GivitBack Foundation</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        html { scroll-behavior: smooth; }
        body { margin: 0; font-family: 'Poppins', sans-serif; }
        
        /* Navigation - Simple, clean, and anchors will work perfectly now */
        .nav-bar { position: fixed; top: 0; width: 100%; display: flex; justify-content: flex-end; padding: 20px 50px; background: rgba(0,0,0,0.5); z-index: 1000; }
        .nav-bar a { color: white; text-decoration: none; margin-left: 25px; font-weight: 600; text-transform: uppercase; font-size: 13px; }
        
        /* Add your existing CSS for hero, metrics, programs, gallery, cta, and footer here */
        /* (I have omitted the bulk CSS here for brevity, but you should paste all your <style> content inside these <style> tags) */
    </style>
</head>
<body>

    <div class="nav-bar">
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#programs">Programs</a>
        <a href="#impact">Impact</a>
        <a href="#footer">Contact</a>
    </div>

    <div id="home">...</div>
    <div id="about">...</div>
    <div id="programs">...</div>
    <div id="impact">...</div>
    <div id="footer">...</div>

</body>
</html>
